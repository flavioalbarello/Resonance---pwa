<style>
/* Layout: una colonna da telefono, contatore del fiato in testa, barra a schede in basso, SOS sempre a portata di pollice. */
:root {
  --bg: #E9F1F4;        /* foschia del mattino */
  --surface: #F7FBFC;
  --line: #CFDDE3;
  --fg: #12283A;        /* inchiostro di mare */
  --muted: #557083;
  --accent: #127C7A;    /* acqua bassa */
  --accent-soft: #D3ECEA;
  --sun: #E8913E;       /* alba: le vittorie */
  --sun-soft: #FBE6D0;
  --ok: #2E8B57;
  --warn: #B4542F;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-num: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1A24; --surface: #13242F; --line: #24394A; --fg: #E2EDF2; --muted: #93AABA;
    --accent: #5CC6BF; --accent-soft: #173A3D; --sun: #F4B272; --sun-soft: #3A2A1B;
    --ok: #6FCB94; --warn: #F08E6A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1A24; --surface: #13242F; --line: #24394A; --fg: #E2EDF2; --muted: #93AABA;
  --accent: #5CC6BF; --accent-soft: #173A3D; --sun: #F4B272; --sun-soft: #3A2A1B;
  --ok: #6FCB94; --warn: #F08E6A; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background: var(--bg); color: var(--fg); font: 16px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.12; margin: 0; text-wrap: balance; }
h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: .01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font: 500 .72rem/1 var(--f-num); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; align-items: center; justify-content: space-between; padding-block: 14px 2px; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.plain { display: grid; gap: 12px; }

/* Il contatore */
.hero { display: grid; gap: 6px; padding-block: 8px 4px; }
.clock { font: 500 clamp(2.4rem, 11vw, 3.6rem)/1 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.clock small { font-size: .38em; color: var(--muted); letter-spacing: 0; margin-left: 2px; margin-right: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px; min-width: 0; }
.stat b { font: 500 1.1rem/1.15 var(--f-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat span { font-size: .78rem; color: var(--muted); }
.stat.sun { background: var(--sun-soft); border-color: transparent; }

.msg { border-left: 3px solid var(--sun); padding: 2px 0 2px 14px; font-family: var(--f-display); font-size: 1.12rem; font-weight: 500; line-height: 1.35; }

/* Tappe del corpo */
.miles { display: grid; gap: 10px; }
.mile { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: start; }
.mile .when { font: 500 .8rem/1.3 var(--f-num); color: var(--muted); padding-top: 2px; }
.mile .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
.mile .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.mile.done .bar i { background: var(--ok); }
.mile.done .when { color: var(--ok); }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 .72rem/1 var(--f-num); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.hi { background: var(--accent-soft); color: var(--accent); }
.pill.mid { background: var(--sun-soft); color: var(--sun); }
.pill.lo { background: transparent; border: 1px solid var(--line); color: var(--muted); }

.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--surface); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.sun { background: var(--sun); color: #1D1206; }
.btn.small { padding: 8px 12px; font-size: .9rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1 1 160px; }

label { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
input[type=range] { accent-color: var(--accent); padding: 0; border: 0; background: transparent; }
input:not([type=range]), select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; color: var(--fg); }
textarea { resize: vertical; min-height: 60px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 10px 12px; background: var(--bg); border-radius: 10px; }
.list li > span { min-width: 0; overflow-wrap: anywhere; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 2px 6px; }

.check { display: flex; gap: 10px; align-items: flex-start; color: var(--fg); font-size: .95rem; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }

.progress { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--sun); }

/* SOS */
.sos-fab {
  position: fixed; z-index: 20;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 999px; padding: 14px 20px; font: 800 1rem/1 var(--f-display);
  background: var(--sun); color: #1D1206; box-shadow: 0 6px 22px rgba(232,145,62,.35);
}
.breath { display: grid; place-items: center; padding-block: 8px; }
.ring { width: min(64vw, 240px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; display: grid; place-items: center; position: relative; }
.ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, var(--accent-soft) 0%, var(--accent-soft) 55%, transparent 72%); transform: scale(.62); transition: transform 4s ease-in-out; }
.ring.in::before { transform: scale(1); transition-duration: 4s; }
.ring.out::before { transform: scale(.62); transition-duration: 6s; }
.ring .inner { position: relative; text-align: center; display: grid; gap: 2px; }
.ring .t { font: 500 2.2rem/1 var(--f-num); font-variant-numeric: tabular-nums; }
.ring .cue { font-family: var(--f-display); font-weight: 700; color: var(--accent); }
canvas.wave { width: 100%; height: 90px; display: block; }

/* Evidenze */
.ev { display: grid; gap: 6px; padding-block: 12px; border-top: 1px solid var(--line); }
.ev:first-of-type { border-top: 0; padding-top: 0; }
.ev .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.ev .src { font: .75rem/1.4 var(--f-num); color: var(--muted); }

.phone { font: 500 1.5rem/1 var(--f-num); letter-spacing: .02em; user-select: all; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.tabs a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: .78rem; }
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

.banner { background: var(--warn); color: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; z-index: 30; font-size: .9rem; max-width: calc(100% - 32px); text-align: center; }
details summary { cursor: pointer; font-weight: 700; }
@media (max-width: 380px) { .stats { grid-template-columns: 1fr 1fr; } .grid2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .ring::before { transition: none !important; } }
</style>
</head>

<script>
"use strict";
/* ============ Dati ============ */
const KEY = "respiro-v1";
const MIN_PER_SIG = 20; // stima UCL (Jackson et al. 2024/25): ~20 minuti di vita per sigaretta
const H = 3600e3, D = 24 * H;

function vuoto() {
  return {
    v: 1, creato: null,
    quitAt: null, streakStart: null,
    sigGiorno: 20, prezzoPacco: 6.5, perPacco: 20,
    motivi: [], piani: [], voglie: [], scivolate: [],
    supporto: {}, obiettivo: { nome: "", costo: 0 }
  };
}
let S = vuoto();
let storageOk = true;
function carica() {
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(vuoto(), JSON.parse(raw)); }
  catch (e) { storageOk = false; }
}
function salva() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
  catch (e) { storageOk = false; }
  mostraBanner();
  return storageOk;
}
function mostraBanner() {
  const b = document.getElementById("banner");
  b.hidden = storageOk;
  b.textContent = "Non riesco a salvare su questo dispositivo (memoria piena o navigazione privata). I dati di oggi resteranno solo finché la pagina è aperta: esportali da Piano.";
}

/* ============ Calcoli ============ */
const now = () => Date.now();
function iniziato() { return S.quitAt && now() >= new Date(S.quitAt).getTime(); }
function streakMs() { return S.streakStart ? Math.max(0, now() - new Date(S.streakStart).getTime()) : 0; }
function sigFumate() { return S.scivolate.reduce((a, s) => a + (Number(s.n) || 1), 0); }
function evitate() {
  if (!iniziato()) return 0;
  const giorni = (now() - new Date(S.quitAt).getTime()) / D;
  return Math.max(0, giorni * S.sigGiorno - sigFumate());
}
function risparmio() { return evitate() * (S.prezzoPacco / Math.max(1, S.perPacco)); }
function vogliePassate() { return S.voglie.filter(v => v.esito === "passata").length; }
const eur = n => n.toLocaleString("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: n < 100 ? 2 : 0 });
const intero = n => Math.floor(n).toLocaleString("it-IT");
function durataVita(min) {
  if (min < 60) return Math.floor(min) + " min";
  if (min < 60 * 48) return Math.round(min / 60) + " ore";
  return (min / 1440).toFixed(1).replace(".", ",") + " giorni";
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function giornoN() { return Math.floor(streakMs() / D); }

/* ============ Contenuti con fonte ============ */
const TAPPE = [
  { ms: 20 * 60e3, quando: "20 min", testo: "Polso e pressione tornano a scendere." },
  { ms: 12 * H, quando: "12 ore", testo: "Il monossido di carbonio nel sangue torna normale. Più ossigeno ai muscoli." },
  { ms: 48 * H, quando: "2 giorni", testo: "Gusto e olfatto iniziano a risvegliarsi." },
  { ms: 72 * H, quando: "3 giorni", testo: "Respirare viene più facile, i bronchi si rilassano." },
  { ms: 14 * D, quando: "2 settimane", testo: "Superata la finestra che pesa di più sul risultato a 6 mesi." },
  { ms: 28 * D, quando: "4 settimane", testo: "Irritabilità e insonnia da astinenza di solito sono finite (durano 2–4 settimane)." },
  { ms: 84 * D, quando: "12 settimane", testo: "Circolazione migliore, scale e corsa più facili." },
  { ms: 270 * D, quando: "9 mesi", testo: "Meno tosse e fiato corto, ciglia dei bronchi al lavoro." },
  { ms: 365 * D, quando: "1 anno", testo: "Rischio di infarto dimezzato rispetto a chi fuma." },
  { ms: 5 * 365 * D, quando: "5 anni", testo: "Rischio di ictus verso quello di chi non ha mai fumato." }
];

const MESSAGGI = [
  "Ogni ora senza fumo, il sangue porta un po' più di ossigeno. Lo senti salendo le scale.",
  "Chi smette, in media, si ritrova con meno ansia e meno stress di prima. La calma arriva dopo l'astinenza, non prima.",
  "La voglia è un'onda: sale, ha un picco, scende. Non serve combatterla, basta non salirci sopra.",
  "Il gusto torna. Il caffè di domani sa più di caffè.",

  "I sintomi dell'astinenza hanno una data di scadenza: 2–4 settimane. Ogni giorno è un giorno in meno.",
  "Quello che risparmi è tuo. Dagli un nome e guardalo crescere.",
  "Zero tiri è più facile di pochi tiri. Un no netto costa meno di cento trattative.",
  "Ogni sigaretta non fumata sono circa venti minuti in più. Li stai accumulando adesso.",
  "La pelle riceve più sangue, le mani sono più calde. Piccole cose che si sommano.",
  "Dormire peggio i primi giorni è normale e passa. Il sonno dopo è migliore.",
  "Non sei «uno che resiste». Sei uno che non fuma. Cambia la frase e cambia la fatica.",

  "Se una giornata è storta, è la giornata a essere storta, non tu. Domani riparti dal fiato."
];

const TRIGGER = ["Caffè", "Dopo mangiato", "Stress", "Alcol", "Pausa lavoro", "Guida", "Noia", "Telefono", "Con chi fuma", "Risveglio"];
const ALLORA = {

};

const SUPPORTO = [
  ["medico", "Ho chiamato il Centro Antifumo o il medico (citisina gratis nei centri dal 2026)"],
  ["nicotina", "Ho scelto il mio aiuto: farmaco, nicotina combinata o e-cig con nicotina"],
  ["casa", "Ho tolto sigarette, accendini e posaceneri da casa, auto e borse"],

const EVIDENZE = [
  { t: "Farmaco o nicotina, più supporto", lv: "hi", l: "Alta",
    d: "Vareniclina, citisina e sigaretta elettronica con nicotina sono i più efficaci. Cerotto più gomma o spray (nicotina combinata) è vicino. In Italia la citisina (Recigar) è gratis nei percorsi dei Centri Antifumo dal 2026; la vareniclina è tornata nel 2025, a pagamento. Scegli col medico.",
    s: "Cochrane NMA 2023 · AIFA 15/12/2025" },
  { t: "Sigaretta elettronica con nicotina", lv: "hi", l: "Alta",
    d: "Aiuta più dei sostituti nicotinici (circa +60% di chi smette a 6 mesi). Usala per uscire dalla sigaretta; poi, se vuoi, scala anche lei.",
    s: "Cochrane, Lindson et al. 2025" },
  { t: "Una data netta", lv: "hi", l: "RCT",
    d: "Smettere di colpo batte la riduzione graduale: 22% contro 15,5% senza fumo a 6 mesi, anche fra chi preferiva ridurre. Scegli un giorno entro due settimane.",
    s: "Lindson-Hawley, Ann Intern Med 2016" },
  { t: "Zero tiri nelle prime due settimane", lv: "mid", l: "Osservazionale",
    d: "Fumare anche poco in quella finestra è il segnale più forte di ricaduta. Per questo Respiro mette in evidenza i giorni 1–14.",
    s: "Kenford et al., JAMA 1994" },
  { t: "Piani «se… allora…»", lv: "mid", l: "Moderata",
    d: "Decidere prima cosa farai davanti al tuo trigger aumenta le probabilità di smettere (OR 1,7).",

  { t: "Muoversi quando arriva la voglia", lv: "hi", l: "Forte",

/* ============ Rendering ============ */
const V = document.getElementById("view");
let vista = "oggi";
let timers = [];
function pulisci() { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; cancelAnimationFrame(rafId); }

function toast(t) {
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status"); el.textContent = t;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function nav() {
  const h = (location.hash || "#oggi").slice(1);
  vista = ["oggi", "sos", "piano", "scienza"].includes(h) ? h : "oggi";
  document.querySelectorAll("nav.tabs a").forEach(a => {
    if (a.dataset.v === vista) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  document.getElementById("sosFab").hidden = vista === "sos";
  render();
  window.scrollTo(0, 0);
}

function render() {
  pulisci();
  document.getElementById("today").textContent = new Date().toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" });
  if (vista === "oggi") return S.quitAt ? renderOggi() : renderSetup();
  if (vista === "sos") return renderSOS();
  if (vista === "piano") return renderPiano();
  if (vista === "scienza") return renderScienza();
}

/* ---- Setup ---- */
function oggiISO(offsetGiorni) {
  const d = new Date(now() + (offsetGiorni || 0) * D);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

  V.innerHTML = `

      </label>
      <button class="btn" type="submit">Parto</button>
      <p class="small muted">I dati restano su questo telefono. Nessun account.</p>
    </form>
  </div>`;
  V.querySelectorAll("[data-off]").forEach(b => b.onclick = () => { document.getElementById("sQuit").value = oggiISO(Number(b.dataset.off)); });
  document.getElementById("setup").onsubmit = e => {
    e.preventDefault();
    const q = new Date(document.getElementById("sQuit").value);
    if (isNaN(q)) return toast("Scegli una data valida");
    S.quitAt = q.toISOString(); S.streakStart = S.quitAt; S.creato = new Date().toISOString();

    if (m) S.motivi.push(m);

}

}

    </div>` : ""}
    <div class="row">
      <div class="stat grow" style="background:var(--surface)"><b>${vogliePassate()}</b><span>voglie superate${vogliePassate() ? ". Ognuna allena la prossima." : ". La prima sarà la più istruttiva."}</span></div>
      <button class="btn sun grow" type="button" id="goSos">Ho voglia adesso</button>
    </div>
    ${obj ? `<div class="card">

    </div>` : `<a class="card" href="#piano" style="text-decoration:none;color:inherit"><h3>Dai un nome al risparmio</h3><p class="small muted">Un premio concreto aiuta davvero: gli incentivi sono fra le cose con più prove. Impostalo in Piano.</p></a>`}
    ${S.motivi.length ? `<div class="card"><span class="eyebrow">I tuoi perché</span><ul class="list">${S.motivi.map(m => `<li><span>${esc(m)}</span></li>`).join("")}</ul></div>` : ""}
    <section class="card">
      <div class="row" style="justify-content:space-between"><h3>Il corpo, intanto</h3>${prossima ? `<span class="pill">prossima: ${prossima.quando}</span>` : ""}</div>
      <div class="miles">${TAPPE.map(t => {

        return `<div class="mile ${done ? "done" : ""}"><span class="when">${done ? "✓ " : ""}${t.quando}</span><div><p class="small">${t.testo}</p><div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></div></div></div>`;
      }).join("")}</div>

      <div class="row">

function registraScivolata() {

/* ---- SOS: l'onda della voglia ---- */
let rafId = 0;
function renderSOS() {
  const DUR = 180; // 3 minuti: il tempo che serve a un'onda per passare
  let t0 = performance.now(), fine = false;
  let triggerScelto = "";
  V.innerHTML = `
  <div class="plain">
    <div class="hero">
      <span class="eyebrow">Voglia in corso</span>
      <h2>È un'onda. Sale, arriva in cima, scende.</h2>
      <p class="muted">Restiamo qui tre minuti. Respira col cerchio: 4 secondi dentro, 6 fuori.</p>
    </div>
    <div class="breath"><div class="ring" id="ring"><div class="inner"><span class="t num" id="tleft">3:00</span><span class="cue" id="cue">Dentro</span></div></div></div>
    <canvas class="wave" id="wave" aria-hidden="true"></canvas>
    <div class="card">
      <span class="eyebrow">Mentre aspetti, scegli una cosa</span>
      <div class="chips" id="azioni">
        <button class="chip" type="button" data-a="muovi">Muoviti</button>
        <button class="chip" type="button" data-a="acqua">Acqua</button>
        <button class="chip" type="button" data-a="piano">Il mio piano</button>
        <button class="chip" type="button" data-a="perche">I miei perché</button>
        <button class="chip" type="button" data-a="nicotina">Ho l'aiuto?</button>
      </div>
      <div id="azione" class="small"></div>
    </div>
    <div class="card">
      <span class="eyebrow">Cosa l'ha accesa?</span>
      <div class="chips" id="trig">${TRIGGER.map(t => `<button class="chip" type="button" aria-pressed="false" data-t="${t}">${t}</button>`).join("")}</div>
      <label><span>Intensità <span class="num" id="intV">6</span>/10</span><input type="range" id="int" min="1" max="10" value="6"></label>
    </div>
    <div class="row">
      <button class="btn grow" type="button" id="passata">È passata</button>
      <button class="btn ghost grow" type="button" id="fumato">Ho fumato</button>
    </div>
  </div>`;
  const AZ = {
    muovi: "Scegli una: 2 rampe di scale, 20 squat, 5 minuti di passo svelto. L'attività moderata o vivace abbassa la voglia subito, ed è l'aiuto con più prove fra quelli che puoi fare da solo.",
    acqua: "Un bicchiere grande, a piccoli sorsi. Tiene bocca e mani occupate per un minuto buono.",
    piano: () => {
      if (!S.piani.length) return "Non hai ancora piani. Dopo questa voglia scrivine uno in Piano: «Se " + (triggerScelto || "bevo il caffè") + ", allora…».";
      const p = S.piani.find(x => x.se === triggerScelto) || S.piani[0];
      return "<b>Se " + esc(p.se.toLowerCase()) + ",</b> allora " + esc(p.allora) + ".";
    },
    perche: () => S.motivi.length ? S.motivi.map(m => "• " + esc(m)).join("<br>") : "Scrivi i tuoi perché in Piano. Pensa a cosa guadagni, non a cosa eviti.",
    nicotina: "Se usi gomme, pastiglie o spray alla nicotina, questo è il momento giusto: sono fatti per le voglie improvvise, insieme al cerotto. Se usi l'e-cig con nicotina, usala ora invece di una sigaretta."
  };
  V.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const a = AZ[b.dataset.a]; document.getElementById("azione").innerHTML = typeof a === "function" ? a() : a;
  });
  V.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    V.querySelectorAll("[data-t]").forEach(x => x.setAttribute("aria-pressed", "false"));
    if (triggerScelto === b.dataset.t) { triggerScelto = ""; return; }
    triggerScelto = b.dataset.t; b.setAttribute("aria-pressed", "true");
  });
  const int = document.getElementById("int");
  int.oninput = () => document.getElementById("intV").textContent = int.value;

  // respiro 4-6
  const ring = document.getElementById("ring"), cue = document.getElementById("cue");
  const ciclo = () => {
    ring.classList.remove("out"); ring.classList.add("in"); cue.textContent = "Dentro";
    timers.push(setTimeout(() => { ring.classList.remove("in"); ring.classList.add("out"); cue.textContent = "Fuori"; }, 4000));
  };
  ciclo(); timers.push(setInterval(ciclo, 10000));

  // onda
  const cv = document.getElementById("wave"), ctx = cv.getContext("2d");
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const curva = x => Math.exp(-Math.pow((x - .32) / .2, 2)) * .9 + .06; // sale presto, picco, poi scende
  function draw() {
    const el = (performance.now() - t0) / 1000, p = Math.min(1, el / DUR);
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const y = x => h - 8 - curva(x) * (h - 20);
    ctx.beginPath(); ctx.moveTo(0, h);
    for (let i = 0; i <= 100; i++) ctx.lineTo(i / 100 * w, y(i / 100));
    ctx.lineTo(w, h); ctx.closePath(); ctx.fillStyle = css("--accent-soft"); ctx.fill();
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) { const X = i / 100 * w; i ? ctx.lineTo(X, y(i / 100)) : ctx.moveTo(X, y(0)); }
    ctx.strokeStyle = css("--line"); ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i <= p * 100; i++) { const X = i / 100 * w; i ? ctx.lineTo(X, y(i / 100)) : ctx.moveTo(X, y(0)); }
    ctx.strokeStyle = css("--accent"); ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(p * w, y(p), 7, 0, Math.PI * 2); ctx.fillStyle = css("--sun"); ctx.fill();
    ctx.fillStyle = css("--muted"); ctx.font = "12px " + css("--f-num");
    ctx.textAlign = "left"; ctx.fillText(p < .32 ? "sale" : p < .6 ? "picco: tieni" : "scende", 8, 16);
    const left = Math.max(0, DUR - el);
    const tl = document.getElementById("tleft");
    if (tl) tl.textContent = Math.floor(left / 60) + ":" + String(Math.floor(left % 60)).padStart(2, "0");
    if (p >= 1 && !fine) { fine = true; cue.textContent = "Fatto"; toast("Tre minuti. L'onda è passata?"); }
    if (!fine) rafId = requestAnimationFrame(draw);
  }
  rafId = requestAnimationFrame(draw);

  const logga = esito => {
    S.voglie.push({ t: new Date().toISOString(), intensita: Number(int.value), trigger: triggerScelto, esito });
  };
  document.getElementById("passata").onclick = () => {
    logga("passata"); salva();
    toast(["Una in meno. Il cervello impara.", "Fatto. Questa vale.", "Superata. La prossima sarà più corta."][vogliePassate() % 3]);
    location.hash = "#oggi";
  };
  document.getElementById("fumato").onclick = () => {
    logga("fumato");
    if (S.quitAt && iniziato()) { S.scivolate.push({ t: new Date().toISOString(), n: 1, trigger: triggerScelto }); S.streakStart = new Date().toISOString(); }
    salva();
    toast("Ripartito. Non cancella niente: da adesso, zero tiri.");
    location.hash = "#piano";
  };
}

      <p class="small muted">Scrivi guadagni, non paure: i messaggi positivi funzionano meglio.</p>
      <ul class="list">${S.motivi.map((m, i) => `<li><span>${esc(m)}</span><button class="x" type="button" aria-label="Elimina" data-del-m="${i}">×</button></li>`).join("")}</ul>
      <div class="row"><input class="grow" type="text" id="mNew" maxlength="140" placeholder="Es.: sentire il profumo del pane" aria-label="Nuovo motivo"><button class="btn small" type="button" id="mAdd">Aggiungi</button></div>
    </section>

    <section class="card">
      <h3>Il salvadanaio</h3>
      <p class="small muted">Quello che non spendi in sigarette va verso qualcosa che vuoi davvero.</p>
      <div class="grid2">
        <label>Cosa<input type="text" id="oNome" maxlength="60" value="${esc(S.obiettivo.nome || "")}" placeholder="Es.: scarpe da trail"></label>
        <label>Quanto costa (€)<input type="number" id="oCosto" min="0" step="1" value="${S.obiettivo.costo || ""}" inputmode="decimal"></label>
      </div>
      <button class="btn small" type="button" id="oSave">Salva obiettivo</button>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between"><h3>Il tuo aiuto</h3><span class="pill">${fatti}/${SUPPORTO.length}</span></div>
      ${SUPPORTO.map(([k, t]) => `<label class="check"><input type="checkbox" data-k="${k}" ${S.supporto[k] ? "checked" : ""}> <span>${t}</span></label>`).join("")}
      <p class="small muted">Telefono Verde contro il Fumo (ISS), gratuito e anonimo, feriali 10–16. Ti indirizza al Centro Antifumo più vicino.</p>
      <div class="row"><span class="phone">800 554088</span><button class="btn ghost small" type="button" id="copyTel">Copia</button></div>
      <a class="small" href="https://smettodifumare.iss.it" target="_blank" rel="noopener">Mappa dei Centri Antifumo</a>
    </section>

    <section class="card">
      <h3>Le tue impostazioni</h3>
      <label>Giorno senza fumo<input type="datetime-local" id="cQuit" value="${S.quitAt ? toLocal(S.quitAt) : oggiISO(0)}"></label>
      <div class="grid2">
        <label>Sigarette al giorno (prima)<input type="number" id="cSig" min="1" value="${S.sigGiorno}" inputmode="numeric"></label>
        <label>Prezzo pacchetto (€)<input type="number" id="cPrezzo" min="0" step="0.1" value="${S.prezzoPacco}" inputmode="decimal"></label>
      </div>
      <button class="btn small" type="button" id="cSave">Salva</button>
      <details>
        <summary class="small">Dati</summary>
        <div class="plain" style="margin-top:10px">
          <p class="small muted">${S.voglie.length} voglie registrate, ${S.scivolate.length} scivolate. Tutto resta su questo dispositivo.</p>
          <div class="row">
            <button class="btn ghost small" type="button" id="dExp">Copia i dati</button>
            <button class="btn ghost small" type="button" id="dDown">Scarica file</button>
          </div>
          <label>Ripristina da dati copiati<textarea id="dImp" placeholder="Incolla qui"></textarea></label>
          <button class="btn ghost small" type="button" id="dImpGo">Ripristina</button>
          <div class="row"><button class="btn ghost small" type="button" id="dReset" style="color:var(--warn)">Ricomincia da capo</button><span class="small muted" id="dResetMsg"></span></div>
        </div>
      </details>
    </section>
  </div>`;
  const pSe = document.getElementById("pSe"), pAllora = document.getElementById("pAllora");
  const sugg = () => { pAllora.placeholder = ALLORA[pSe.value] || ""; };
  pSe.onchange = sugg; if (top.length) pSe.value = top[0][0]; sugg();
  document.getElementById("pAdd").onclick = () => {
    const allora = pAllora.value.trim() || ALLORA[pSe.value];
    S.piani.push({ se: pSe.value, allora }); salva(); renderPiano(); toast("Piano aggiunto");
  };
  V.querySelectorAll("[data-del-p]").forEach(b => b.onclick = () => { S.piani.splice(Number(b.dataset.delP), 1); salva(); renderPiano(); });
  V.querySelectorAll("[data-del-m]").forEach(b => b.onclick = () => { S.motivi.splice(Number(b.dataset.delM), 1); salva(); renderPiano(); });
  document.getElementById("mAdd").onclick = () => {
    const v = document.getElementById("mNew").value.trim(); if (!v) return;
    S.motivi.push(v); salva(); renderPiano();
  };
  document.getElementById("oSave").onclick = () => {
    S.obiettivo = { nome: document.getElementById("oNome").value.trim(), costo: Math.max(0, Number(document.getElementById("oCosto").value) || 0) };
    salva(); toast("Obiettivo salvato");
  };
  V.querySelectorAll("[data-k]").forEach(c => c.onchange = () => { S.supporto[c.dataset.k] = c.checked; salva(); renderPiano(); });
  document.getElementById("copyTel").onclick = () => copia("800554088", "Numero copiato");
  document.getElementById("cSave").onclick = () => {
    const q = new Date(document.getElementById("cQuit").value);
    if (!isNaN(q)) {
      const nuova = q.toISOString();
      if (nuova !== S.quitAt) { S.quitAt = nuova; if (!S.scivolate.length || new Date(S.streakStart) < q) S.streakStart = nuova; }
    }
    S.sigGiorno = Math.max(1, Number(document.getElementById("cSig").value) || S.sigGiorno);
    S.prezzoPacco = Math.max(0, Number(document.getElementById("cPrezzo").value) || 0);
    salva(); toast("Salvato");
  };
  document.getElementById("dExp").onclick = () => copia(JSON.stringify(S), "Dati copiati");
  document.getElementById("dDown").onclick = () => {
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
      a.download = "respiro-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast("Download non disponibile qui: usa «Copia i dati»"); }
  };
  document.getElementById("dImpGo").onclick = () => {
    try {
      const o = JSON.parse(document.getElementById("dImp").value);
      if (!o || o.v !== 1) throw new Error("formato");
      S = Object.assign(vuoto(), o); salva(); toast("Dati ripristinati"); renderPiano();
    } catch (e) { toast("Questi dati non sono di Respiro"); }
  };
  let armato = false;
  document.getElementById("dReset").onclick = () => {
    if (!armato) { armato = true; document.getElementById("dResetMsg").textContent = "Tocca di nuovo per cancellare tutto."; return; }
    S = vuoto(); salva(); location.hash = "#oggi"; render();
  };
}
function toLocal(iso) { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
function copia(testo, ok) {
  try {
    navigator.clipboard.writeText(testo).then(() => toast(ok), () => fallbackCopia(testo, ok));
  } catch (e) { fallbackCopia(testo, ok); }
}
function fallbackCopia(testo, ok) {
  const ta = document.getElementById("dImp");
  if (ta) { ta.value = testo; ta.select(); toast("Selezionato: copia a mano"); } else toast(testo);
}

/* ---- Scienza ---- */

  V.innerHTML = `
  <div class="plain">
    <div class="hero"><span class="eyebrow">Ricerca aggiornata a novembre 2026</span><h2>Cosa funziona davvero</h2>
      <p class="muted">Revisioni Cochrane e studi randomizzati. La combinazione più forte è un aiuto farmacologico (o e-cig con nicotina) più supporto di una persona.</p></div>
    <section class="card">
      ${EVIDENZE.map(e => `<div class="ev"><div class="head"><h3>${e.t}</h3><span class="pill ${e.lv}">${e.l}</span></div><p class="small">${e.d}</p><span class="src">${e.s}</span></div>`).join("")}
    </section>
    <section class="card">
      <h3>Le buone notizie</h3>
      ${BUONE.map(([t, d, s]) => `<div class="ev"><div class="head"><b>${t}</b></div><p class="small">${d}</p><span class="src">${s}</span></div>`).join("")}
    </section>
    <section class="card">
      <h3>Cosa non è dimostrato</h3>
      ${NON_PROVATE.map(e => `<div class="ev"><div class="head"><b>${e.t}</b><span class="pill lo">Non chiaro</span></div><p class="small">${e.d}</p><span class="src">${e.s}</span></div>`).join("")}
    </section>
    <p class="small muted">Respiro non sostituisce il medico. Per farmaci, dosi e schemi rivolgiti al tuo medico o al Centro Antifumo.</p>
  </div>`;
}

carica();
mostraBanner();
document.getElementById("sosFab").onclick = () => location.hash = "#sos";
window.addEventListener("hashchange", nav);
nav();
