<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Respiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F1F4EC">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: una colonna morbida su un prato al mattino. Macchie di luce sullo sfondo, riquadri con angoli
   irregolari come sassi di fiume, il respiro come una bolla viva. Verde foglia per la strada, miele per le vittorie. */
:root {
  --bg: #F1F4EC;        /* aria del mattino sul prato */
  --surface: #FBFCF7;
  --line: #D6E0D1;
  --fg: #22352A;        /* muschio */
  --muted: #5E7466;
  --accent: #4A8159;    /* foglia */
  --accent-soft: #DEEBDA;
  --sun: #D9922B;       /* miele: le vittorie */
  --sun-soft: #F7E7C6;
  --sky: #DCEBEF;       /* cielo, solo nelle macchie di luce */
  --ok: #3F7D52;
  --warn: #B8603A;
  --f-display: "Young Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-num: "Figtree", "Segoe UI", system-ui, sans-serif;
  --r-a: 28px 22px 30px 20px;  /* sasso */
  --r-b: 22px 30px 20px 28px;  /* sasso girato */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121A15; --surface: #18241D; --line: #2A3A30; --fg: #E5EDE5; --muted: #9AB0A1;
    --accent: #8CC79B; --accent-soft: #213428; --sun: #F0B95A; --sun-soft: #3A2E18; --sky: #1A2A2E;
    --ok: #8CC79B; --warn: #E9936B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121A15; --surface: #18241D; --line: #2A3A30; --fg: #E5EDE5; --muted: #9AB0A1;
  --accent: #8CC79B; --accent-soft: #213428; --sun: #F0B95A; --sun-soft: #3A2E18; --sky: #1A2A2E;
  --ok: #8CC79B; --warn: #E9936B; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background: var(--bg);
  color: var(--fg); font: 16px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px));
}
/* macchie di luce ferme dietro la pagina (background-attachment: fixed non regge sui telefoni) */
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38rem 26rem at 110% -6%, var(--sun-soft), transparent 62%),
    radial-gradient(34rem 30rem at -20% 18%, var(--sky), transparent 60%),
    radial-gradient(40rem 34rem at 120% 88%, var(--accent-soft), transparent 62%); }
body { position: relative; z-index: 0; }
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
h1 { font: 400 1.35rem/1 var(--f-display); }
h2 { font: 400 1.6rem/1.18 var(--f-display); }
h3 { font: 400 1.12rem/1.25 var(--f-display); }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.eyebrow { font: 600 .76rem/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

header.top { display: flex; align-items: center; justify-content: space-between; padding-block: 16px 0; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand svg { width: 30px; height: 30px; }
#today { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); }

/* Riquadri come sassi: niente bordo, solo una superficie che respira dallo sfondo */
.card { background: var(--surface); border: 0; border-radius: var(--r-a); padding: 20px; display: grid; gap: 12px; min-width: 0; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(34, 53, 42, .25); }
.card:nth-of-type(even) { border-radius: var(--r-b); }
.plain { display: grid; gap: 12px; }

/* Il contatore */
.hero { display: grid; gap: 4px; padding-block: 10px 2px; }
.clock { font: 400 clamp(2.6rem, 12vw, 3.8rem)/1.05 var(--f-display); font-variant-numeric: tabular-nums lining-nums; }
.clock small { font: 500 .36em/1 var(--f-body); color: var(--muted); margin: 0 .5em 0 .12em; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: 20px 26px 18px 24px; padding: 14px; display: grid; gap: 2px; min-width: 0; box-shadow: 0 1px 0 var(--line); }
.stat:nth-child(2) { border-radius: 26px 18px 24px 20px; }
.stat b { font: 400 1.35rem/1.1 var(--f-display); font-variant-numeric: tabular-nums lining-nums; overflow-wrap: anywhere; }
.stat span { font-size: .8rem; color: var(--muted); line-height: 1.3; }
.stat.sun { background: var(--sun-soft); box-shadow: none; }
.stat.sun b { color: var(--fg); }

.msg { font: 400 1.18rem/1.45 var(--f-display); color: var(--fg); padding: 2px 4px 2px 34px; position: relative; }
.msg::before { content: ""; position: absolute; left: 4px; top: .35em; width: 18px; height: 18px; background: var(--accent); border-radius: 0 70% 0 70%; transform: rotate(-12deg); opacity: .8; }

/* Tappe del corpo: un germoglio che cresce lungo uno stelo */
.miles { display: grid; gap: 12px; }
.mile { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: start; }
.mile .when { font-size: .82rem; font-weight: 600; color: var(--muted); padding-top: 1px; }
.mile .bar { height: 6px; border-radius: 6px; background: var(--accent-soft); overflow: hidden; margin-top: 7px; }
.mile .bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.mile.done .when { color: var(--accent); }

.pill { display: inline-flex; align-items: center; font: 600 .74rem/1 var(--f-body); padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.hi { background: var(--accent-soft); color: var(--accent); }
.pill.mid { background: var(--sun-soft); color: var(--fg); }
.pill.lo { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }

.btn { border: 0; border-radius: 18px 22px 18px 22px; padding: 14px 18px; font: 600 1rem/1.1 var(--f-body); background: var(--accent); color: var(--surface); }
.btn.ghost { background: var(--surface); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent-soft); }
.btn.sun { background: var(--sun); color: #2A1B05; }
.btn.small { padding: 9px 14px; font-size: .92rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1 1 160px; }

label { display: grid; gap: 4px; font-size: .88rem; color: var(--muted); }
input[type=range] { accent-color: var(--accent); padding: 0; border: 0; background: transparent; }
input:not([type=range]), select, textarea { background: var(--bg); border: 1.5px solid transparent; border-radius: 14px; padding: 11px 13px; width: 100%; color: var(--fg); }
input:not([type=range]):focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
textarea { resize: vertical; min-height: 60px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; background: var(--bg); border-radius: 999px; padding: 8px 14px; font-size: .9rem; color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 11px 14px; background: var(--bg); border-radius: 16px 12px 16px 12px; }
.list li > span { min-width: 0; overflow-wrap: anywhere; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 1.15rem; line-height: 1; padding: 2px 6px; }

.check { display: flex; gap: 10px; align-items: flex-start; color: var(--fg); font-size: .95rem; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }

.progress { height: 10px; border-radius: 10px; background: var(--accent-soft); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--sun); border-radius: 10px; }

/* SOS */
.sos-fab {
  position: fixed; z-index: 20;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 26px 30px 24px 32px; padding: 15px 22px; font: 600 1rem/1 var(--f-body);
  background: var(--sun); color: #2A1B05; box-shadow: 0 10px 24px -10px rgba(217, 146, 43, .7);
}
/* Il respiro: una bolla che cambia forma mentre si gonfia (4 s) e si sgonfia (6 s) */
.breath { display: grid; place-items: center; padding-block: 12px; }
.ring { width: min(66vw, 250px); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; position: relative; }
.ring::before, .ring::after { content: ""; position: absolute; inset: 0; transform: scale(.6); transition: transform 4s cubic-bezier(.45, 0, .55, 1); }
.ring::before { background: var(--accent-soft); border-radius: 46% 54% 58% 42% / 50% 42% 58% 50%; animation: forma 12s ease-in-out infinite; }
.ring::after { inset: 14%; background: var(--sun-soft); opacity: .75; border-radius: 58% 42% 46% 54% / 44% 56% 44% 56%; animation: forma 9s ease-in-out infinite reverse; }
.ring.in::before, .ring.in::after { transform: scale(1); transition-duration: 4s; }
.ring.out::before, .ring.out::after { transform: scale(.6); transition-duration: 6s; }
@keyframes forma {
  0%, 100% { border-radius: 40% 60% 64% 36% / 46% 38% 62% 54%; }
  33% { border-radius: 62% 38% 42% 58% / 38% 60% 40% 62%; }
  66% { border-radius: 36% 64% 56% 44% / 60% 42% 58% 40%; }
}
.ring .inner { position: relative; z-index: 1; text-align: center; display: grid; gap: 2px; }
.ring .t { font: 400 2.3rem/1 var(--f-display); font-variant-numeric: tabular-nums lining-nums; }
.ring .cue { font: 400 1.1rem/1 var(--f-display); color: var(--accent); }
canvas.wave { width: 100%; height: 90px; display: block; }

/* Evidenze */
.ev { display: grid; gap: 6px; padding-block: 12px; border-top: 1px solid var(--line); }
.ev:first-of-type { border-top: 0; padding-top: 0; }
.ev .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.ev .src { font-size: .76rem; color: var(--muted); font-style: italic; }

.phone { font: 400 1.7rem/1 var(--f-display); letter-spacing: .02em; user-select: all; font-variant-numeric: lining-nums; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface); border-radius: 26px 22px 28px 24px; padding: 5px; box-shadow: 0 8px 26px -14px rgba(34, 53, 42, .35), 0 0 0 1px var(--line); }
nav.tabs a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 7px 2px; border-radius: 20px; font-size: .74rem; font-weight: 500; }
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

.banner { background: var(--warn); color: var(--surface); border-radius: 16px; padding: 10px 14px; font-size: .9rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 22px 18px 22px 18px; z-index: 30; font-size: .9rem; max-width: calc(100% - 32px); text-align: center; }
details summary { cursor: pointer; font: 400 1.05rem/1.3 var(--f-display); }
.stats.due { grid-template-columns: 1fr 1fr; }
@media (max-width: 380px) { .stats { grid-template-columns: 1fr 1fr; } .grid2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .ring::before, .ring::after { animation: none; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="70 80 372 360" aria-hidden="true"><path d="M256 96c0 40 0 70-2 96" fill="none" stroke="var(--fg)" stroke-width="20" stroke-linecap="round"/>
  <path d="M254 180c-8 22-24 32-44 36M258 180c8 22 24 32 44 36" fill="none" stroke="var(--fg)" stroke-width="16" stroke-linecap="round"/>
  <path d="M224 204C116 206 76 318 104 424c104-6 158-100 120-220z" fill="var(--accent)"/>
  <path d="M288 204c108 2 148 114 120 220-104-6-158-100-120-220z" fill="var(--accent)"/>
  <path d="M216 226c-10 70-40 130-92 180M296 226c10 70 40 130 92 180" fill="none" stroke="var(--surface)" stroke-width="7" stroke-linecap="round" opacity=".8"/></svg>
      <h1>Respiro</h1>
    </div>
    <span class="eyebrow" id="today"></span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>

<button class="sos-fab" id="sosFab" type="button">Ho voglia</button>

<nav class="tabs" aria-label="Sezioni">
  <div class="in">
    <a href="#oggi" data-v="oggi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Oggi</a>
    <a href="#sos" data-v="sos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12c3-5 6-5 9 0s6 5 9 0"/><path d="M2 17c3-5 6-5 9 0s6 5 9 0" opacity=".5"/></svg>Voglia</a>
    <a href="#piano" data-v="piano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M16 17l2 2 4-4"/></svg>Piano</a>
    <a href="#scienza" data-v="scienza"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg>Cosa funziona</a>
  </div>
</nav>

<script>
"use strict";
/* ============ Dati ============ */
const KEY = "respiro-v1";
const MIN_PER_SIG = 20; // stima UCL (Jackson et al. 2024/25): ~20 minuti di vita per sigaretta
const H = 3600e3, D = 24 * H;

function vuoto() {
  return {
    v: 1, creato: null,
    quitAt: null, streakStart: null,
    sigGiorno: 20, prezzoPacco: 6.5, perPacco: 20,
    // tabacco sfuso: costo per sigaretta = busta / sigarette fatte con una busta + cartina e filtro
    tipo: "pacchetti", prezzoBusta: 8.5, perBusta: 50, extraSig: 0.03,
    motivi: [], piani: [], voglie: [], scivolate: [],
    supporto: {}, obiettivo: { nome: "", costo: 0 },
    // percorso: "stop" = data netta; "riduco" = budget giornaliero che scende ogni settimana
    modo: "stop",
    riduzione: null, // { inizio: ISO mezzanotte locale, base, settimane, obiettivo }
    conti: {}        // { "AAAA-MM-GG": sigarette fumate quel giorno } — solo nel percorso riduco
  };
}
let S = vuoto();
let storageOk = true;
function carica() {
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(vuoto(), JSON.parse(raw)); }
  catch (e) { storageOk = false; }
}
function salva() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
  catch (e) { storageOk = false; }
  mostraBanner();
  return storageOk;
}
function mostraBanner() {
  const b = document.getElementById("banner");
  b.hidden = storageOk;
  b.textContent = "Non riesco a salvare su questo dispositivo (memoria piena o navigazione privata). I dati di oggi resteranno solo finché la pagina è aperta: esportali da Piano.";
}

/* ============ Calcoli ============ */
const now = () => Date.now();
function iniziato() { return S.quitAt && now() >= new Date(S.quitAt).getTime(); }
function streakMs() { return S.streakStart ? Math.max(0, now() - new Date(S.streakStart).getTime()) : 0; }
function sigFumate() { return S.scivolate.reduce((a, s) => a + (Number(s.n) || 1), 0); }
function dayKey(t) { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function mezzanotte(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d; }
function giorniDa(iso, t) { return Math.round((mezzanotte(t || now()) - mezzanotte(iso)) / D); }
// Budget a scalini settimanali, come nello schema di Ebbert 2015 (−50% a 4 sett., −75% a 8, zero a 12) ma sulla durata scelta.
function budgetGiorno(n) {
  const R = S.riduzione, k = Math.floor(n / 7);
  if (k >= R.settimane) return R.obiettivo;
  return Math.max(R.obiettivo, Math.ceil(R.base - (R.base - R.obiettivo) * (k + 1) / R.settimane));
}
// Conta solo i giorni registrati: un giorno senza dati non è un giorno a zero.
function evitateRid() {
  if (!S.riduzione) return 0;
  const R = S.riduzione, lim = S.quitAt ? dayKey(S.quitAt) : "9999", ini = dayKey(R.inizio0 || R.inizio), base = R.base0 || R.base;
  let t = 0;
  const oggi = dayKey(now()), quota = (now() - mezzanotte(now())) / D; // oggi conta solo la parte di giornata già passata
  for (const [k, n] of Object.entries(S.conti)) if (k >= ini && k < lim) t += Math.max(0, (k === oggi ? base * quota : base) - n);
  return t;
}
function evitate() {
  let stop = 0;
  if (iniziato()) {
    const giorni = (now() - new Date(S.quitAt).getTime()) / D;
    stop = Math.max(0, giorni * S.sigGiorno - sigFumate());
  }
  return stop + evitateRid();
}
function costoSig() {
  if (S.tipo === "sfuso") return S.prezzoBusta / Math.max(1, S.perBusta) + (Number(S.extraSig) || 0);
  return S.prezzoPacco / Math.max(1, S.perPacco);
}
function risparmio() { return evitate() * costoSig(); }
// Campi del costo, uguali nell'avvio e nelle impostazioni: pacchetti oppure tabacco sfuso.
function campiTabacco(p) {
  const sf = S.tipo === "sfuso";
  return `<div class="plain" id="${p}Tab">
    <div class="chips" role="radiogroup" aria-label="Cosa fumi">
      <button type="button" class="chip" data-tipo="pacchetti" aria-pressed="${!sf}">Pacchetti</button>
      <button type="button" class="chip" data-tipo="sfuso" aria-pressed="${sf}">Tabacco sfuso</button>
    </div>
    <div class="grid2" data-per="pacchetti" ${sf ? "hidden" : ""}>
      <label>Prezzo pacchetto (€)<input type="number" id="${p}Prezzo" min="0" step="0.1" value="${S.prezzoPacco}" inputmode="decimal"></label>
      <label>Sigarette per pacchetto<input type="number" id="${p}PerPacco" min="1" value="${S.perPacco}" inputmode="numeric"></label>
    </div>
    <div class="plain" data-per="sfuso" ${sf ? "" : "hidden"}>
      <div class="grid2">
        <label>Prezzo busta (€)<input type="number" id="${p}Busta" min="0" step="0.1" value="${S.prezzoBusta}" inputmode="decimal"></label>
        <label>Sigarette da una busta<input type="number" id="${p}PerBusta" min="1" value="${S.perBusta}" inputmode="numeric"></label>
      </div>
      <label>Cartina e filtro, per sigaretta (€)<input type="number" id="${p}Extra" min="0" step="0.01" value="${S.extraSig}" inputmode="decimal"></label>
      <p class="small muted">Una busta da 30 g fa di solito 40–60 sigarette. Se non lo sai, conta per quanti giorni ti dura.</p>
    </div>
  </div>`;
}
function attivaTabacco(p) {
  const box = document.getElementById(p + "Tab");
  box.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => {
    box.dataset.tipo = b.dataset.tipo;
    box.querySelectorAll("[data-tipo]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    box.querySelectorAll("[data-per]").forEach(d => d.hidden = d.dataset.per !== b.dataset.tipo);
  });
  box.dataset.tipo = S.tipo;
}
function leggiTabacco(p) {
  const v = id => Number(document.getElementById(p + id).value);
  S.tipo = document.getElementById(p + "Tab").dataset.tipo === "sfuso" ? "sfuso" : "pacchetti";
  S.prezzoPacco = Math.max(0, v("Prezzo") || 0);

  if (meno) meno.onclick = () => { S.conti[oggi] = Math.max(0, S.conti[oggi] - 1); salva(); renderRiduco(); };
  document.getElementById("toStop").onclick = () => {
    S.modo = "stop"; S.quitAt = new Date().toISOString(); S.streakStart = S.quitAt; salva(); render();
    toast("Da adesso, zero. Il contatore è tuo.");
  };
  const tz = document.getElementById("toZero");
  if (tz) tz.onclick = () => {
    // riparte da oggi con base = tetto attuale, 4 settimane fino a zero: niente salti bruschi
    // base0/inizio0 conservano il punto di partenza: risparmi e storico non si perdono
    S.riduzione = { inizio: mezzanotte(now()).toISOString(), base: b, settimane: 4, obiettivo: 0, base0: R.base0 || R.base, inizio0: R.inizio0 || R.inizio };
    salva(); renderRiduco(); toast("Nuovo traguardo: zero in 4 settimane.");
  };
}
function graficoRid(n) {
  const R = S.riduzione, W = 300, Hh = 110, pad = 18, giorni = 14;
  const dati = [];
  for (let i = giorni - 1; i >= 0; i--) {
    const t = now() - i * D, key = dayKey(t), dn = n - i;
    dati.push({ key, c: key in S.conti ? S.conti[key] : null, b: dn >= 0 ? budgetGiorno(dn) : null, g: new Date(t).toLocaleDateString("it-IT", { weekday: "narrow" }) });
  }
  const max = Math.max(1, R.base0 || R.base, ...dati.map(d => d.c || 0));
  const bw = (W - 8) / giorni, y = v => Hh - pad - (v / max) * (Hh - pad - 8);
  let barre = "", linea = "", etich = "";
  dati.forEach((d, i) => {
    const x = 4 + i * bw;
    if (d.c !== null) {
      const top = y(d.c), cls = "var(--accent)"; // un colore solo: il grafico mostra la strada, non i giorni «sbagliati»
      barre += `<rect x="${(x + bw * .18).toFixed(1)}" y="${top.toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${Math.max(1.5, Hh - pad - top).toFixed(1)}" rx="2" fill="${cls}"/>`;
    } else {
      barre += `<circle cx="${(x + bw / 2).toFixed(1)}" cy="${Hh - pad - 2}" r="1.6" fill="var(--line)"/>`;
    }
    if (d.b !== null) linea += `${linea ? "L" : "M"}${x.toFixed(1)} ${y(d.b).toFixed(1)}H${(x + bw).toFixed(1)}`;
    etich += `<text x="${(x + bw / 2).toFixed(1)}" y="${Hh - 4}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--f-num)">${d.g}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Sigarette fumate negli ultimi 14 giorni rispetto all'obiettivo">
    <line x1="4" x2="${W - 4}" y1="${Hh - pad}" y2="${Hh - pad}" stroke="var(--line)" stroke-width="1"/>
    <text x="4" y="10" font-size="9" fill="var(--muted)" font-family="var(--f-num)">${max}</text>
    ${barre}<path d="${linea}" fill="none" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="3 2" opacity=".55"/>${etich}</svg>`;
}

/* ---- SOS: l'onda della voglia ---- */
let rafId = 0;
function renderSOS() {
  const DUR = 180; // 3 minuti: il tempo che serve a un'onda per passare
  let t0 = performance.now(), fine = false;
  let triggerScelto = "";
  V.innerHTML = `
  <div class="plain">
    <div class="hero">
      <span class="eyebrow">Voglia in corso</span>
      <h2>È un'onda. Sale, arriva in cima, scende.</h2>

    </div>
    <div class="breath"><div class="ring" id="ring"><div class="inner"><span class="t num" id="tleft">3:00</span><span class="cue" id="cue">Dentro</span></div></div></div>
    <canvas class="wave" id="wave" aria-hidden="true"></canvas>
    <div class="card">
      <span class="eyebrow">Mentre aspetti, scegli una cosa</span>
      <div class="chips" id="azioni">
        <button class="chip" type="button" data-a="muovi">Muoviti</button>
        <button class="chip" type="button" data-a="acqua">Acqua</button>
        <button class="chip" type="button" data-a="piano">Il mio piano</button>
        <button class="chip" type="button" data-a="perche">I miei perché</button>
        <button class="chip" type="button" data-a="nicotina">Ho l'aiuto?</button>
      </div>
      <div id="azione" class="small"></div>
    </div>
    <div class="card">
      <span class="eyebrow">Cosa l'ha accesa?</span>
      <div class="chips" id="trig">${TRIGGER.map(t => `<button class="chip" type="button" aria-pressed="false" data-t="${t}">${t}</button>`).join("")}</div>
      <label><span>Intensità <span class="num" id="intV">6</span>/10</span><input type="range" id="int" min="1" max="10" value="6"></label>
    </div>
    <div class="row">
      <button class="btn grow" type="button" id="passata">È passata</button>
      <button class="btn ghost grow" type="button" id="fumato">${S.modo === "riduco" ? "L'ho fumata" : "Ho fumato"}</button>
    </div>
  </div>`;
  const AZ = {
    muovi: "Scegli una: 2 rampe di scale, 20 squat, 5 minuti di passo svelto. L'attività moderata o vivace abbassa la voglia subito, ed è l'aiuto con più prove fra quelli che puoi fare da solo.",
    acqua: "Un bicchiere grande, a piccoli sorsi. Tiene bocca e mani occupate per un minuto buono.",
    piano: () => {
      if (!S.piani.length) return "Non hai ancora piani. Dopo questa voglia scrivine uno in Piano: «Se " + (triggerScelto || "bevo il caffè") + ", allora…».";
      const p = S.piani.find(x => x.se === triggerScelto) || S.piani[0];
      return "<b>Se " + esc(p.se.toLowerCase()) + ",</b> allora " + esc(p.allora) + ".";
    },
    perche: () => S.motivi.length ? S.motivi.map(m => "• " + esc(m)).join("<br>") : "Scrivi i tuoi perché in Piano. Pensa a cosa guadagni, non a cosa eviti.",
    nicotina: "Se usi gomme, pastiglie o spray alla nicotina, questo è il momento giusto: sono fatti per le voglie improvvise, insieme al cerotto. Se usi l'e-cig con nicotina, usala ora invece di una sigaretta."
  };
  V.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const a = AZ[b.dataset.a]; document.getElementById("azione").innerHTML = typeof a === "function" ? a() : a;
  });
  V.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    V.querySelectorAll("[data-t]").forEach(x => x.setAttribute("aria-pressed", "false"));
    if (triggerScelto === b.dataset.t) { triggerScelto = ""; return; }
    triggerScelto = b.dataset.t; b.setAttribute("aria-pressed", "true");
  });
  const int = document.getElementById("int");
  int.oninput = () => document.getElementById("intV").textContent = int.value;

  // respiro 4-6
  const ring = document.getElementById("ring"), cue = document.getElementById("cue");
  const ciclo = () => {
    ring.classList.remove("out"); ring.classList.add("in"); cue.textContent = "Dentro";
    timers.push(setTimeout(() => { ring.classList.remove("in"); ring.classList.add("out"); cue.textContent = "Fuori"; }, 4000));
  };
  ciclo(); timers.push(setInterval(ciclo, 10000));

  // onda
  const cv = document.getElementById("wave"), ctx = cv.getContext("2d");
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const curva = x => Math.exp(-Math.pow((x - .32) / .2, 2)) * .9 + .06; // sale presto, picco, poi scende
  function draw() {
    const el = (performance.now() - t0) / 1000, p = Math.min(1, el / DUR);
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const y = x => h - 8 - curva(x) * (h - 20);
    ctx.beginPath(); ctx.moveTo(0, h);
    for (let i = 0; i <= 100; i++) ctx.lineTo(i / 100 * w, y(i / 100));
    ctx.lineTo(w, h); ctx.closePath(); ctx.fillStyle = css("--accent-soft"); ctx.fill();
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) { const X = i / 100 * w; i ? ctx.lineTo(X, y(i / 100)) : ctx.moveTo(X, y(0)); }
    ctx.strokeStyle = css("--line"); ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i <= p * 100; i++) { const X = i / 100 * w; i ? ctx.lineTo(X, y(i / 100)) : ctx.moveTo(X, y(0)); }
    ctx.strokeStyle = css("--accent"); ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(p * w, y(p), 7, 0, Math.PI * 2); ctx.fillStyle = css("--sun"); ctx.fill();
    ctx.fillStyle = css("--muted"); ctx.font = "12px " + css("--f-num");
    ctx.textAlign = "left"; ctx.fillText(p < .32 ? "sale" : p < .6 ? "picco: tieni" : "scende", 8, 16);
    const left = Math.max(0, DUR - el);
    const tl = document.getElementById("tleft");
    if (tl) tl.textContent = Math.floor(left / 60) + ":" + String(Math.floor(left % 60)).padStart(2, "0");
    if (p >= 1 && !fine) { fine = true; cue.textContent = "Fatto"; toast("Tre minuti. L'onda è passata?"); }
    if (!fine) rafId = requestAnimationFrame(draw);
  }
  rafId = requestAnimationFrame(draw);

  const logga = esito => {
    S.voglie.push({ t: new Date().toISOString(), intensita: Number(int.value), trigger: triggerScelto, esito });
  };
  document.getElementById("passata").onclick = () => {
    logga("passata"); salva();
    toast(["Una in meno. Il cervello impara.", "Fatto. Questa vale.", "Superata. La prossima sarà più corta."][vogliePassate() % 3]);
    location.hash = "#oggi";
  };
  document.getElementById("fumato").onclick = () => {
    logga("fumato");
    if (S.modo === "riduco" && S.riduzione) {

      toast("Contata. Ogni rimando che riesce allena il prossimo.");
      location.hash = "#oggi"; return;
    }
    if (S.quitAt && iniziato()) { S.scivolate.push({ t: new Date().toISOString(), n: 1, trigger: triggerScelto }); S.streakStart = new Date().toISOString(); }
    salva();
    toast("Ripartito. Non cancella niente: da adesso, zero tiri.");
    location.hash = "#piano";
  };
}

        <label>Sigarette al giorno (prima)<input type="number" id="cSig" min="1" value="${S.sigGiorno}" inputmode="numeric"></label>
      </div>
      ${campiTabacco("c")}
      <div class="row"><button class="btn small" type="button" id="cSave">Salva</button><button class="btn ghost small" type="button" id="cPath">Cambia percorso</button></div>
      <details>
        <summary class="small">Dati</summary>
        <div class="plain" style="margin-top:10px">
          <p class="small muted">${S.voglie.length} voglie registrate, ${S.scivolate.length} scivolate. Tutto resta su questo dispositivo.</p>
          <div class="row">
            <button class="btn ghost small" type="button" id="dExp">Copia i dati</button>
            <button class="btn ghost small" type="button" id="dDown">Scarica file</button>
          </div>
          <label>Ripristina da dati copiati<textarea id="dImp" placeholder="Incolla qui"></textarea></label>
          <button class="btn ghost small" type="button" id="dImpGo">Ripristina</button>
          <div class="row"><button class="btn ghost small" type="button" id="dReset" style="color:var(--warn)">Ricomincia da capo</button><span class="small muted" id="dResetMsg"></span></div>
        </div>
      </details>
    </section>
  </div>`;
  attivaTabacco("c");
  const pSe = document.getElementById("pSe"), pAllora = document.getElementById("pAllora");
  const sugg = () => { pAllora.placeholder = ALLORA[pSe.value] || ""; };
  pSe.onchange = sugg; if (top.length) pSe.value = top[0][0]; sugg();
  document.getElementById("pAdd").onclick = () => {
    const allora = pAllora.value.trim() || ALLORA[pSe.value];
    S.piani.push({ se: pSe.value, allora }); salva(); renderPiano(); toast("Piano aggiunto");
  };
  V.querySelectorAll("[data-del-p]").forEach(b => b.onclick = () => { S.piani.splice(Number(b.dataset.delP), 1); salva(); renderPiano(); });
  V.querySelectorAll("[data-del-m]").forEach(b => b.onclick = () => { S.motivi.splice(Number(b.dataset.delM), 1); salva(); renderPiano(); });
  document.getElementById("mAdd").onclick = () => {
    const v = document.getElementById("mNew").value.trim(); if (!v) return;
    S.motivi.push(v); salva(); renderPiano();
  };
  document.getElementById("oSave").onclick = () => {
    S.obiettivo = { nome: document.getElementById("oNome").value.trim(), costo: Math.max(0, Number(document.getElementById("oCosto").value) || 0) };
    salva(); toast("Obiettivo salvato");
  };
  V.querySelectorAll("[data-k]").forEach(c => c.onchange = () => { S.supporto[c.dataset.k] = c.checked; salva(); renderPiano(); });
  document.getElementById("copyTel").onclick = () => copia("800554088", "Numero copiato");
  document.getElementById("cSave").onclick = () => {
    const cq = document.getElementById("cQuit");
    const q = cq ? new Date(cq.value) : new Date(NaN);
    if (!isNaN(q)) {
      const nuova = q.toISOString();
      if (nuova !== S.quitAt) { S.quitAt = nuova; if (!S.scivolate.length || new Date(S.streakStart) < q) S.streakStart = nuova; }
    }
    S.sigGiorno = Math.max(1, Number(document.getElementById("cSig").value) || S.sigGiorno);
    leggiTabacco("c");
    salva(); toast("Salvato");
  };
  document.getElementById("cPath").onclick = () => { S.modo = "stop"; S.quitAt = null; S.streakStart = null; salva(); location.hash = "#oggi"; render(); };
  document.getElementById("dExp").onclick = () => copia(JSON.stringify(S), "Dati copiati");
  document.getElementById("dDown").onclick = () => {
    const nome = "respiro-" + new Date().toISOString().slice(0, 10) + ".json";
    if (window.RespiroAndroid) { // dentro l'APK: il ponte nativo scrive in Download
      if (!window.RespiroAndroid.salva(nome, JSON.stringify(S, null, 2))) toast("Non riesco a salvare il file: usa «Copia i dati»");
      return;
    }
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
      a.download = "respiro-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast("Download non disponibile qui: usa «Copia i dati»"); }
  };
  document.getElementById("dImpGo").onclick = () => {
    try {
      const o = JSON.parse(document.getElementById("dImp").value);
      if (!o || o.v !== 1) throw new Error("formato");
      S = Object.assign(vuoto(), o); salva(); toast("Dati ripristinati"); renderPiano();
    } catch (e) { toast("Questi dati non sono di Respiro"); }
  };
  let armato = false;
  document.getElementById("dReset").onclick = () => {
    if (!armato) { armato = true; document.getElementById("dResetMsg").textContent = "Tocca di nuovo per cancellare tutto."; return; }
    S = vuoto(); salva(); location.hash = "#oggi"; render();
  };
}
function toLocal(iso) { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
function copia(testo, ok) {
  try {
    navigator.clipboard.writeText(testo).then(() => toast(ok), () => fallbackCopia(testo, ok));
  } catch (e) { fallbackCopia(testo, ok); }
}
function fallbackCopia(testo, ok) {
  const ta = document.getElementById("dImp");
  if (ta) { ta.value = testo; ta.select(); toast("Selezionato: copia a mano"); } else toast(testo);
}
