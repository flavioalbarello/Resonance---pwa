name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # L'SDK Android è già sul runner; il plugin scarica da solo piattaforma e build-tools mancanti.
      # (setup-android@v3 chiede il pacchetto "tools", che nel repository di Google non esiste più.)
      - name: Prove (logica, archivio su Room, schermate)
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Chiave di firma dai segreti, se c'è
        env:
          KEYSTORE_B64: ${{ secrets.RESONANCE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/resonance.jks"
            echo "RESONANCE_KEYSTORE=$RUNNER_TEMP/resonance.jks" >> "$GITHUB_ENV"
          fi
      - name: APK
        env:
          RESONANCE_KEYSTORE_PASSWORD: ${{ secrets.RESONANCE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$RESONANCE_KEYSTORE" ]; then ./gradlew assembleRelease --console=plain; else ./gradlew assembleDebug --console=plain; fi
      - uses: actions/upload-artifact@v4
        with:
          name: resonance-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/schermate/*.png
